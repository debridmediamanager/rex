[package]
name = "rex"
version = "0.4.0"
edition = "2021"
description = "A media server for the official Plex apps that owns no files: serves the library its sources push and streams it from where it lives"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
# Already serde_json's: its traits parse a row for a listing without its streams (`rows.rs`).
serde = "1"
libc = "0.2"
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
rustls = "0.23"
rustls-pemfile = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
# Ben's exception to the crate set (2026-10-31): artwork is decoded, in pure Rust, for the
# BlurHash and UltraBlur colours a real PMS answers (runtime/blur.rs). Plex's artwork is JPEG,
# PNG or WebP; nothing else is compiled in.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
png = { version = "0.18", default-features = false }
image-webp = { version = "0.2", default-features = false }

[build-dependencies]
# Already rex's: `build.rs` gzips `data/` into the binary with it.
flate2 = { version = "1", default-features = false, features = ["zlib"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rex"
path = "src/main.rs"
