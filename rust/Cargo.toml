[package]
name = "rex"
version = "0.3.0"
edition = "2021"
description = "A Plex Media Server that owns no files: serves a library its sources push and streams it from where it lives"
license = "MIT"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
libc = "0.2"
sha1 = "0.10"
regex = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
rustls = "0.23"
rustls-pemfile = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rex"
path = "src/main.rs"
