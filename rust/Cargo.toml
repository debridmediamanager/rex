[package]
name = "plexsim"
version = "0.1.0"
edition = "2021"
description = "Native Plex protocol emulator (migration bootstrap)"
license = "UNLICENSED"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
libc = "0.2"
sha1 = "0.10"
regex = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
rustls = "0.23"
rustls-pemfile = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "plexsim"
path = "src/main.rs"
