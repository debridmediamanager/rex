name: CI

# Like zurg's build.yml, CI runs only for a tag, the nightly or a manual run, never for a push or
# a pull request: on GitHub-hosted runners every push spent the org's Actions budget, which ran
# out on 2026-10-19 and then blocked every run. Prove a push locally (cargo test and the suites
# below). A tag `vX.Y.Z` builds every platform and publishes the GitHub release with the tag's
# own message as its notes. A manual run (workflow_dispatch) builds and tests every platform
# without publishing anything.
#
# A nightly builds every platform and publishes a prerelease tagged YYYY.MM.DD.HHMM-nightly
# beside zurg's, with the commits since the previous release as its notes and a `nightly`
# image. It is dispatched with nightly=true from dmm at 00:40 Berlin by the same
# /home/ben/zurg-nightly-dispatch.sh that fires zurg's (see zurg's build.yml for why the
# clock lives there), and the cron below is its fallback for a night dmm is down. `gate`
# skips a nightly when main has nothing the last one did not carry, or when tonight's went out.
#
# The platforms are the ones zurg's private releases are actually downloaded for, counted on
# 2026-10-12 above the flat number every asset gets from whatever fetches them all: linux
# amd64 and arm64, macOS amd64 and arm64, Windows amd64.
#
# Self-hosted, as zurg's: every Linux job runs on the repo-scoped `dmm` runner and the Windows
# tests on `winbox` (ben@windows), so neither the minutes nor an exhausted Actions budget can
# stop a nightly. dmm is a production host (the database and the uploaders), so everything is
# compiled and tested inside .github/ci/Dockerfile's image through .github/ci/in-image.sh: Ubuntu
# 22.04 (glibc 2.35, so the Linux binaries run on 22.04 and newer), capped at 6 CPUs and
# 16 GB, its suites on the container's own loopback. Windows is cross-compiled with MinGW and
# macOS with cargo-zigbuild; the macOS binaries are checked for their architecture and run no
# suite, since no runner is a Mac. Binaries pass between jobs through REX_STAGE on dmm instead
# of artifact storage, which an exhausted budget also refuses (zurg's build.yml, 2026-09-14);
# the Windows runner reads its two over SSH with a key dmm lets read that directory only.

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Publish a nightly prerelease'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The event too: a manual run queued behind a run would otherwise cancel a pending nightly.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The transcoder suite runs against the FFmpeg rex is measured with, pinned, so a failure
  # means rex changed. Ubuntu 22.04's own FFmpeg 4.4 lands a far seek a segment early.
  JELLYFIN_FFMPEG: https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/jellyfin-ffmpeg_8.1.3-1_portable
  # No suite may reach plex.tv: a test claim or announce writes to a real account.
  REX_PLEXTV_URL: http://127.0.0.1:9
  REX_STAGE: /home/ben/rex-ci-stage

jobs:
  gate:
    runs-on: [self-hosted, Linux, X64, dmm]
    outputs:
      build: ${{ steps.gate.outputs.build }}
      nightly: ${{ steps.gate.outputs.nightly }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      # Nothing else deletes a run's stage directory when it dies before `release`, and dmm's
      # disk is the database's.
      - name: Sweep stage directories older than two days
        run: |
          mkdir -p "$REX_STAGE"
          find "$REX_STAGE" -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} +

      - uses: actions/checkout@v4

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
          FORCED: ${{ inputs.nightly == true }}
        run: |
          set -euo pipefail
          echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Berlin date +%Y.%m.%d.%H%M-nightly)" >> "$GITHUB_OUTPUT"
          if [ "$NIGHTLY" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same two questions zurg's prep asks, against the nightlies that went out.
          tip=$(git log -1 --format=%ct HEAD)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select((.draft | not) and (.tag_name | endswith("-nightly"))) | .published_at] | max // ""')
          build=true
          if [ -n "$latest" ]; then
            latest_ts=$(date -u -d "$latest" +%s)
            age_h=$(( ($(date -u +%s) - latest_ts) / 3600 ))
            if [ "$tip" -le "$latest_ts" ]; then
              echo "main's tip is already in the nightly at $latest"; build=false
            elif [ "$age_h" -lt 20 ] && [ "$FORCED" != true ]; then
              # The fallback cron behind tonight's dispatch, which the queue may run hours late.
              echo "the nightly at $latest went out ${age_h}h ago"; build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, dmm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and Rust unit tests
        run: |
          .github/ci/in-image.sh '
            cargo build --release --locked --manifest-path rust/Cargo.toml
            cargo test --release --locked --manifest-path rust/Cargo.toml
            mkdir -p rust/target/release
            cp "$CARGO_TARGET_DIR/release/rex" rust/target/release/rex'

      # zurg's main generates what its feed sends rex (internal/rexfeed/contract_test.go);
      # test_zurg_contract replays it. A read-only deploy key on zurg, since both are private.
      - uses: actions/checkout@v4
        with:
          repository: debridmediamanager/zurg
          ssh-key: ${{ secrets.ZURG_CONTRACT_KEY }}
          path: zurg-contract
          sparse-checkout: internal/rexfeed/testdata
          sparse-checkout-cone-mode: false

      - name: Black-box suites
        env:
          ZURG_CONTRACT: ${{ github.workspace }}/zurg-contract/internal/rexfeed/testdata/rex-contract.json
        run: |
          # These suites use throwaway catalogs and loopback ports. The runner
          # captures each child's output before emitting its own log group, so
          # concurrent suites remain attributable and every child is reaped.
          # Each child receives a stable, disjoint REX_TEST_PORTS range below
          # 32768; the native smoke's fixed 32620 is outside those ranges.
          .github/ci/in-image.sh 'python3 tests/parallel_suites.py --workers 4 \
            test_startup_wait test_test_ports test_parallel_suites test_cli test_server_command \
            test_native_runtime_smoke test_pms_identity test_sqlite_store test_build_catalog test_tls test_part_bytes \
            test_sources test_feed test_feed_versions test_feed_editions test_feed_season_art \
            test_feed_blank_tiles test_feed_source_names test_feed_source_decides test_feed_placement test_feed_rejected test_feed_display test_feed_subtitles test_feed_extras test_match_show_children test_feed_episode_ids test_feed_retry_placed test_delete_last_episode test_feed_versions_1017 test_zurg_contract test_plextv test_rex_direct test_track_prefs test_accounts test_kometa \
            test_unclaimed_gate test_photo_ssrf test_manager test_paused_limit test_dashboard_accounts test_dashboard_resources test_share_restrictions test_stream_limits test_auto_collections test_accept_exhaustion \
            test_body_framing test_catalog_features test_parity_split_guid test_merge_unpaired test_parity_cycle88_b test_sidecars_embedded'

      # No GPU in the container: this is the CPU (x264) path, with the hardware probe on auto.
      # The pinned FFmpeg is kept beside the cargo cache, so it downloads once per pin.
      - name: Transcoder suite
        run: |
          .github/ci/in-image.sh '
            d=/home/ben/rex-ci-cache/ffmpeg/${JELLYFIN_FFMPEG##*/}-linux64
            [ -x "$d/ffmpeg" ] || { mkdir -p "$d" && curl -sSfL "${JELLYFIN_FFMPEG}_linux64-gpl.tar.xz" | tar -xJ -C "$d"; }
            export REX_TRANSCODER="$d/ffmpeg" PATH="$d:$PATH"
            python3 tests/test_native_transcode.py
            python3 tests/test_download_queue.py
            python3 tests/test_perf_artwork_save.py
            python3 tests/test_subtitles.py
            python3 tests/test_transcode_premium.py
            python3 tests/test_transcode_accounts.py
            python3 tests/test_analysis_processing.py
            python3 tests/test_webhooks.py
            python3 tests/test_cinema_playback.py
            export REX_TEST_FFMPEG="$d/ffmpeg" REX_THUMBNAIL_TEST_FFMPEG="$d/ffmpeg" REX_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
            cargo test --release --locked --manifest-path rust/Cargo.toml runtime::markers::tests -- --ignored
            cargo test --release --locked --manifest-path rust/Cargo.toml thumbnails::tests::ffmpeg_images_and_roku_index -- --ignored
            cargo test --release --locked --manifest-path rust/Cargo.toml runtime::analysis::tests::generated_jpeg_restore_checks_hash_containment_corruption_and_removal -- --ignored
            cargo test --release --locked --manifest-path rust/Cargo.toml converted_download_is_atomic_at_the_requested_destination -- --ignored
            cargo test --release --locked --manifest-path rust/Cargo.toml platform::tests::real_process_resource_smoke -- --ignored
            cargo test --release --locked --manifest-path rust/Cargo.toml catalog::tests::a_row_written_in_place_does_not_rescan_the_library -- --ignored --test-threads=1'

      - name: Stage
        run: install -D -m 755 rust/target/release/rex "$REX_STAGE/${{ github.run_id }}/rex-linux-amd64"

  linux-arm64:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, dmm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # It runs under emulation (dmm's binfmt qemu-aarch64, F flag, so it works in a container):
      # the CLI and the server answering on a port are what a cross build can get wrong that the
      # amd64 suites would not see.
      - name: Build and smoke test under qemu
        run: |
          .github/ci/in-image.sh '
            cargo build --release --locked --manifest-path rust/Cargo.toml --target aarch64-unknown-linux-gnu
            mkdir -p rust/target/release
            cp "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/rex" rust/target/release/rex
            file rust/target/release/rex | grep -q aarch64
            python3 tests/test_cli.py
            python3 tests/test_native_runtime_smoke.py'

      - name: Stage
        run: install -D -m 755 rust/target/release/rex "$REX_STAGE/${{ github.run_id }}/rex-linux-arm64"

  darwin:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, dmm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Cross-built: no runner here is a Mac, so this checks the architecture and nothing runs.
      # The first cross build (2026-10-19) ran test_cli, the native smoke, test_build_catalog,
      # test_sources and test_feed on an Apple Silicon Mac, and --help under Rosetta.
      - name: Build
        run: |
          .github/ci/in-image.sh '
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo zigbuild --release --locked --manifest-path rust/Cargo.toml --target $t
            done
            mkdir -p out
            cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/rex" out/rex-darwin-arm64
            cp "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/rex" out/rex-darwin-amd64
            file out/rex-darwin-arm64 | grep -q "Mach-O 64-bit arm64"
            file out/rex-darwin-amd64 | grep -q "Mach-O 64-bit x86_64"'

      - name: Stage
        run: install -D -m 755 -t "$REX_STAGE/${{ github.run_id }}" out/rex-darwin-arm64 out/rex-darwin-amd64

  windows-amd64:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64, dmm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The unit tests are built here too and run on Windows by the next job.
      - name: Build
        run: |
          .github/ci/in-image.sh '
            cargo build --release --locked --manifest-path rust/Cargo.toml --target x86_64-pc-windows-gnu
            tests=$(cargo test --release --locked --manifest-path rust/Cargo.toml --lib \
                      --target x86_64-pc-windows-gnu --no-run --message-format=json \
                    | python3 -c "import json,sys; print([m[\"executable\"] for m in map(json.loads, sys.stdin) if m.get(\"reason\") == \"compiler-artifact\" and m.get(\"executable\") and m[\"target\"][\"kind\"] == [\"lib\"]][-1])")
            mkdir -p out
            cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release/rex.exe" out/rex-windows-amd64.exe
            cp "$tests" out/rex-tests.exe'

      - name: Stage
        run: install -D -m 755 -t "$REX_STAGE/${{ github.run_id }}" out/rex-windows-amd64.exe out/rex-tests.exe

  windows-test:
    needs: windows-amd64
    # ben@windows, repo-scoped like zurg's winbox runner, running as NETWORK SERVICE, whose PATH
    # has no bash: `shell: bash` failed "bash: command not found". Git for Windows' by its 8.3
    # path, since the runner splits a custom shell at its first space.
    runs-on: [self-hosted, Windows, X64, winbox]
    timeout-minutes: 45
    defaults:
      run:
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      # The suites read their fixtures without naming an encoding.
      PYTHONUTF8: "1"
      PULL_KEY: C:/actions-runner-rex/ci-pull
    steps:
      - uses: actions/checkout@v4

      # A key dmm takes only for /home/ben/bin/rex-ci-pull, which prints one file of this run's
      # stage directory. Windows' own ssh: it checks the key's ACL, which Git's does not.
      - name: Fetch the build from dmm
        run: |
          pull() {
            /c/Windows/System32/OpenSSH/ssh.exe -n -i "$PULL_KEY/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$PULL_KEY/known_hosts" ben@dmm.tail-net.ts.net \
              "${{ github.run_id }}/$1" > "$2"
          }
          mkdir -p rust/target/release
          pull rex-windows-amd64.exe rust/target/release/rex.exe
          pull rex-tests.exe rust/rex-tests.exe
          file rust/target/release/rex.exe | grep -q PE32+

      # The service account cannot read ben's per-user Python, so a full one from NuGet's
      # `python` package is unpacked into the runner's tool cache, once per version.
      - name: Python
        run: |
          d="$(cygpath -u "$RUNNER_TOOL_CACHE")/python-nuget/3.12.10"
          if [ ! -x "$d/tools/python.exe" ]; then
            mkdir -p "$d"
            curl -sSfL -o "$d.zip" https://www.nuget.org/api/v2/package/python/3.12.10
            unzip -q "$d.zip" -d "$d" && rm "$d.zip"
          fi
          echo "$(cygpath -w "$d/tools")" >> "$GITHUB_PATH"

      - name: Rust unit tests
        working-directory: rust
        run: ./rex-tests.exe

      # Not test_manager: `rex manager` is Linux and macOS only (process groups, signals).
      # test_tls needs openssl, which Git for Windows ships.
      - name: Black-box suites
        run: |
          set -e
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          for suite in test_cli test_server_command test_native_runtime_smoke test_build_catalog \
                       test_pms_identity test_tls test_part_bytes test_sources test_feed test_feed_versions \
                       test_feed_season_art test_feed_blank_tiles test_feed_source_names test_feed_source_decides test_plextv test_unclaimed_gate test_photo_ssrf test_accounts \
                       test_body_framing test_catalog_features test_parity_split_guid test_merge_unpaired test_parity_cycle88_b; do
            echo "::group::$suite"
            python "tests/$suite.py"
            echo "::endgroup::"
          done

      # No GPU used; on Windows rex knows NVENC only, so this is the CPU path.
      - name: Transcoder suite
        run: |
          # A C:\ path's colon would split PATH.
          dir="$(cygpath -u "$RUNNER_TOOL_CACHE")/jellyfin-ffmpeg/${JELLYFIN_FFMPEG##*/}-win64"
          if [ ! -x "$dir/ffmpeg.exe" ]; then
            mkdir -p "$dir"
            curl -sSfL -o "$dir.zip" "${JELLYFIN_FFMPEG}_win64-clang-gpl.zip"
            unzip -q "$dir.zip" -d "$dir" && rm "$dir.zip"
          fi
          export REX_TRANSCODER="$(cygpath -w "$dir/ffmpeg.exe")" PATH="$dir:$PATH"
          python tests/test_native_transcode.py

  release:
    if: startsWith(github.ref, 'refs/tags/v') || needs.gate.outputs.nightly == 'true'
    needs: [gate, test, linux-arm64, darwin, windows-test]
    runs-on: [self-hosted, Linux, X64, dmm]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.nightly == 'true' && needs.gate.outputs.version || github.ref_name }}
      NIGHTLY: ${{ needs.gate.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect everything the build jobs staged
        run: |
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            install -D -m 755 "$REX_STAGE/${{ github.run_id }}/rex-$platform" "artifacts/rex-$platform/rex"
          done
          install -D -m 755 "$REX_STAGE/${{ github.run_id }}/rex-windows-amd64.exe" artifacts/rex-windows-amd64/rex.exe

      - name: Check the tag matches Cargo.toml
        if: env.NIGHTLY != 'true'
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match rust/Cargo.toml version $crate"
            exit 1
          fi

      # Each archive keeps the repository's layout, so `rex manager`, run.sh and every
      # command in the docs find the binary at rust/target/release/rex either way. The
      # measured sidecars in data/ are compiled into the binary; rex reads none of them here.
      - name: Package
        run: |
          set -e
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            name="rex-${TAG}-${platform}"
            binary=rex; [ "$platform" = windows-amd64 ] && binary=rex.exe
            mkdir -p "$name/rust/target/release"
            install -m 755 "artifacts/rex-$platform/$binary" "$name/rust/target/release/$binary"
            git ls-files -z -- data examples \
                README.md LICENSE docs/setup.md docs/feed-api.md \
              | xargs -0 cp --parents -t "$name"
            if [ "$platform" = windows-amd64 ]; then
              zip -qr "$name.zip" "$name"
            else
              tar czf "$name.tar.gz" "$name"
            fi
          done
          sha256sum rex-*.tar.gz rex-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$NIGHTLY" = true ]; then
            # dmm's gh is Ubuntu's 2.4.0, whose `release list` has no --json: every nightly
            # since the move to dmm failed here (2026-10-19, 10-20). `gh api` is the gate's call.
            prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // ""')
            git log --no-merges --format='- %s' ${prev:+"$prev..HEAD"} -n 200 > notes.md
            test -s notes.md || echo "- no changes" > notes.md
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "rex $TAG" --notes-file notes.md \
              rex-*.tar.gz rex-*.zip SHA256SUMS
            exit 0
          fi
          # actions/checkout leaves the tag as a plain pointer to the commit, so its own
          # message is gone and %(contents) reads the commit's (v0.1.0 went out that way).
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # Subject and body only: %(contents) also carries a signed tag's PGP block, which
          # v0.1.1's notes went out with.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "rex ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            rex-*.tar.gz rex-*.zip SHA256SUMS

      # Nightlies only, to #general through the webhook zurg's nightlies use. A tag is
      # announced by whoever cut it. The release is already out, so a failure here loses
      # only the post.
      - name: Announce the nightly on Discord
        if: env.NIGHTLY == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python3 .github/announce_nightly.py "$TAG" \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" "$GITHUB_SHA" notes.md

  # Kept until here so a failed release can be rerun; a run that never gets here is swept by
  # the next run's gate after two days.
  unstage:
    needs: release
    runs-on: [self-hosted, Linux, X64, dmm]
    steps:
      - run: rm -rf "$REX_STAGE/${{ github.run_id }}"

  # The image packages the archives the release just published (docker.yml).
  docker:
    needs: [gate, release]
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.gate.outputs.nightly == 'true' && needs.gate.outputs.version || github.ref_name }}
    permissions:
      contents: read
      packages: write
