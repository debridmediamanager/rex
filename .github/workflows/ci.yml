name: CI

# Every push to main and every pull request builds rex and runs the suites that need no
# credentials and no network beyond loopback. A tag `vX.Y.Z` does the same, builds the other
# platforms, and publishes the GitHub release with the tag's own message as its notes. A
# manual run (workflow_dispatch) builds every platform without publishing anything.
#
# The platforms are the ones zurg's private releases are actually downloaded for, counted on
# 2026-10-12 above the flat number every asset gets from whatever fetches them all: linux
# amd64 and arm64, macOS amd64 and arm64, Windows amd64.
#
# GitHub-hosted runners, not the org's self-hosted one: that runner is fun, which is
# production. ubuntu-22.04 links against glibc 2.35, what zen and fun run, so the Linux
# binaries run on them and on anything newer. macOS and Windows minutes cost ten and two
# times Linux ones on a private repository, which is why those build only for a tag or a
# manual run. Windows is cross-compiled with MinGW on Linux (no Visual Studio needed) and
# then tested on a Windows runner.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No suite may reach plex.tv: a test claim or announce writes to a real account.
  REX_PLEXTV_URL: http://127.0.0.1:9

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Rust unit tests
        run: cargo test --release --locked --manifest-path rust/Cargo.toml

      - name: Black-box suites
        run: |
          set -e
          for suite in test_cli test_server_command test_native_runtime_smoke test_build_catalog \
                       test_tls test_part_bytes test_sources test_feed test_feed_versions \
                       test_plextv test_manager; do
            echo "::group::$suite"
            python3 "tests/$suite.py"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rex-linux-amd64
          path: rust/target/release/rex
          retention-days: 7

  linux-arm64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: aarch64

      - name: Cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static binfmt-support

      - name: Build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --target aarch64-unknown-linux-gnu

      # It runs under emulation: the CLI and the server answering on a port are what a
      # cross build can get wrong that the amd64 suites would not see.
      - name: Smoke test under qemu
        run: |
          mkdir -p rust/target/release
          cp rust/target/aarch64-unknown-linux-gnu/release/rex rust/target/release/rex
          file rust/target/release/rex | grep -q aarch64
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          python3 tests/test_cli.py
          python3 tests/test_native_runtime_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: rex-linux-arm64
          path: rust/target/aarch64-unknown-linux-gnu/release/rex
          retention-days: 7

  darwin:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path rust/Cargo.toml --target x86_64-apple-darwin

      # The runner is Apple Silicon, so the arm64 binary runs the same suites the Linux
      # one does; the amd64 binary is checked under Rosetta.
      - name: Test
        run: |
          set -e
          mkdir -p rust/target/release
          cp rust/target/aarch64-apple-darwin/release/rex rust/target/release/rex
          for suite in test_cli test_native_runtime_smoke test_build_catalog test_sources test_feed; do
            echo "::group::$suite"
            python3 "tests/$suite.py"
            echo "::endgroup::"
          done
          file rust/target/x86_64-apple-darwin/release/rex | grep -q x86_64
          arch -x86_64 rust/target/x86_64-apple-darwin/release/rex --help | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: rex-darwin-arm64
          path: rust/target/aarch64-apple-darwin/release/rex
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: rex-darwin-amd64
          path: rust/target/x86_64-apple-darwin/release/rex
          retention-days: 7

  windows-amd64:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows

      - name: Cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      # The unit tests are built here too and run on Windows by the next job.
      - name: Build
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml --target x86_64-pc-windows-gnu
          tests=$(cargo test --release --locked --manifest-path rust/Cargo.toml --lib \
                    --target x86_64-pc-windows-gnu --no-run --message-format=json \
                  | python3 -c 'import json,sys; print([m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["kind"] == ["lib"]][-1])')
          mkdir -p out
          cp rust/target/x86_64-pc-windows-gnu/release/rex.exe out/
          cp "$tests" out/rex-tests.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rex-windows-amd64
          path: out/rex.exe
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: rex-windows-tests
          path: out/rex-tests.exe
          retention-days: 1

  windows-test:
    needs: windows-amd64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # The suites read their fixtures without naming an encoding; the shipped tools name
      # UTF-8 themselves (test_build_catalog checks that with UTF-8 mode off).
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rex-windows-amd64
          path: rust/target/release

      - uses: actions/download-artifact@v4
        with:
          name: rex-windows-tests
          path: rust

      - name: Rust unit tests
        working-directory: rust
        run: ./rex-tests.exe

      # Not test_manager: manager.py is Linux and macOS only (process groups, signals).
      # test_tls needs openssl, which Git for Windows ships.
      - name: Black-box suites
        run: |
          set -e
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          for suite in test_cli test_server_command test_native_runtime_smoke test_build_catalog \
                       test_tls test_part_bytes test_sources test_feed test_feed_versions test_plextv; do
            echo "::group::$suite"
            python "tests/$suite.py"
            echo "::endgroup::"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-arm64, darwin, windows-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match rust/Cargo.toml version $crate"
            exit 1
          fi

      # Each archive keeps the repository's layout, so manager.py, run.sh and every
      # command in the docs find the binary at rust/target/release/rex either way. rex reads
      # its measured sidecars from data/, beside the catalog or in its working directory.
      - name: Package
        run: |
          set -e
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            name="rex-${GITHUB_REF_NAME}-${platform}"
            binary=rex; [ "$platform" = windows-amd64 ] && binary=rex.exe
            mkdir -p "$name/rust/target/release"
            install -m 755 "artifacts/rex-$platform/$binary" "$name/rust/target/release/$binary"
            git ls-files -z -- data examples \
                oracle/build_catalog.py oracle/catalogdb.py oracle/hierarchy.py oracle/metadata.py \
                oracle/manager.py \
                README.md LICENSE docs/setup.md docs/feed-api.md \
              | xargs -0 cp --parents -t "$name"
            if [ "$platform" = windows-amd64 ]; then
              zip -qr "$name.zip" "$name"
            else
              tar czf "$name.tar.gz" "$name"
            fi
          done
          sha256sum rex-*.tar.gz rex-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout leaves the tag as a plain pointer to the commit, so its own
          # message is gone and %(contents) reads the commit's (v0.1.0 went out that way).
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # Subject and body only: %(contents) also carries a signed tag's PGP block, which
          # v0.1.1's notes went out with.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "rex ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            rex-*.tar.gz rex-*.zip SHA256SUMS
