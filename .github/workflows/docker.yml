name: Docker

# Publishes ghcr.io/debridmediamanager/rex for a release, from that release's own Linux
# archives: no compile, so QEMU only runs the image's apt-get for arm64. The package belongs
# to this private repository and inherits its access, as zurg's sponsor image does.
#
# CI's release job calls it for every tag. Run it by hand (Actions, "Run workflow") to
# publish an image for a release that has none.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.3.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the release's Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd docker
          gh release download "$TAG" -p "rex-$TAG-linux-*.tar.gz" -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            tar xzf "rex-$TAG-linux-$arch.tar.gz" -C "dist/$arch" --strip-components=1
            test -x "dist/$arch/rust/target/release/rex"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A nightly is `nightly` and its own tag; it never moves `latest`.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=raw,value=latest,enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=raw,value=${{ inputs.tag }},enable=${{ endsWith(inputs.tag, '-nightly') }}
            type=raw,value=nightly,enable=${{ endsWith(inputs.tag, '-nightly') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The image must start and seed a catalog, on the architecture the runner has.
      - name: Smoke test
        run: |
          set -e
          image="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker run -d --name rex-smoke -p 32400:32400 -e REX_PLEXTV_URL=http://127.0.0.1:9 "$image" --gdm off
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:32400/identity && break; sleep 1; done
          curl -sf http://127.0.0.1:32400/rex/sources | grep -q '"size":0'
          docker logs rex-smoke 2>&1 | grep -q 'seeded '
          # rex.db holds the sources' logins: it must not be readable by others on the host.
          test "$(docker exec rex-smoke stat -c %a /config/rex.db)" = 600
          docker stop rex-smoke
