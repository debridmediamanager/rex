name: Docker

# Publishes ghcr.io/debridmediamanager/rex for a release or nightly, from its own Linux
# archives: no compile, so QEMU only runs the image's apt-get for arm64. The package belongs
# to this repository and is public, as the repository is (since 2026-10-31).
#
# CI's release job calls it for every tag. Run it by hand (Actions, "Run workflow") to
# publish an image for a release that has none.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.3.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Self-hosted, as CI is (ci.yml), so an exhausted Actions budget cannot stop it: on a
  # temporary Hetzner VM of the run's own, whose binfmt runs arm64. It ran on dmm until
  # 2026-11-12, where QEMU's apt-get loaded the host that serves the production database.
  build-vm:
    runs-on: [self-hosted, Linux, X64, dmm]
    steps:
      - run: ~/bin/hz-ci up rex ${{ github.run_id }} cx33,cpx32,cpx42

  image:
    needs: build-vm
    runs-on: [self-hosted, "hz-${{ github.run_id }}"]
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the release's Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd docker
          gh release download "$TAG" -p "rex-$TAG-linux-*.tar.gz" -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            tar xzf "rex-$TAG-linux-$arch.tar.gz" -C "dist/$arch" --strip-components=1
            test -x "dist/$arch/rex"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A nightly is `nightly` and its own tag; it never moves `latest`.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=raw,value=latest,enable=${{ !endsWith(inputs.tag, '-nightly') }}
            type=raw,value=${{ inputs.tag }},enable=${{ endsWith(inputs.tag, '-nightly') }}
            type=raw,value=nightly,enable=${{ endsWith(inputs.tag, '-nightly') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The image must start and seed a catalog, on the architecture the runner has.
      - name: Smoke test
        run: |
          set -e
          image="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          # dmm is a shared host: a loopback-only port of its own, and no container left behind.
          docker rm -f rex-smoke >/dev/null 2>&1 || true
          docker run -d --rm --name rex-smoke -p 127.0.0.1:32699:32400 -e REX_PLEXTV_URL=http://127.0.0.1:9 "$image" --gdm off
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:32699/identity && break; sleep 1; done
          curl -sf http://127.0.0.1:32699/rex/sources | grep -q '"size":0'
          docker logs rex-smoke 2>&1 | grep -q 'seeded '
          # rex.db holds the sources' logins: it must not be readable by others on the host.
          test "$(docker exec rex-smoke stat -c %a /config/rex.db)" = 600
          docker stop rex-smoke

  build-vm-down:
    needs: [build-vm, image]
    if: always() && needs.build-vm.result == 'success'
    runs-on: [self-hosted, Linux, X64, dmm]
    steps:
      - run: ~/bin/hz-ci down rex ${{ github.run_id }} ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'keep' || '' }}
