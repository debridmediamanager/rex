# plexscratch42 -- a DISPOSABLE, ISOLATED PMS pinned to 1.42.2, the build rex reports.
#
# plexscratch is a copy of the lab's config and therefore 1.43.4. Four open questions
# (cycles 21, 25, 27, 28) all said "a writable 1.42.2 copy" would settle them. This is that:
# a FRESH install of 1.42.2.10156 -- the exact build the 1.42.2 reference runs -- with its
# own config, the lab's media mounted READ-ONLY, no route to plex.tv, and the same loopback
# hop plexscratch uses (an unclaimed PMS refuses a Host that is not localhost or its own
# address, and a source outside allowedNetworks).
#
# It is fresh rather than copied, so there is no identity to strip: it has never held a
# plex.tv token and cannot announce anything. Its items are UNMATCHED by construction --
# nothing can reach an agent -- which is exactly right for the edit-grammar and session
# questions and wrong for anything needing real metadata.
services:
  plex:
    image: plexinc/pms-docker:1.42.2.10156-f737b826c
    container_name: plexscratch42-plex
    restart: "no"
    environment:
      TZ: "Europe/Amsterdam"
      PLEX_UID: "1000"
      PLEX_GID: "1000"
      ALLOWED_NETWORKS: "192.168.88.0/24,100.64.0.0/10,172.16.0.0/12,127.0.0.1/32"
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ../plexscratch/media-long:/data:ro
    networks: [inside]

  loopback:
    image: alpine/socat:latest
    container_name: plexscratch42-loopback
    restart: "no"
    network_mode: "service:plex"
    command: TCP-LISTEN:32499,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:32400
    depends_on: [plex]

  relay:
    image: alpine/socat:latest
    container_name: plexscratch42-relay
    restart: "no"
    command: TCP-LISTEN:32400,fork,reuseaddr TCP:plexscratch42-plex:32499
    ports:
      - "${SCRATCH_BIND:-127.0.0.1}:32411:32400"
    depends_on: [loopback]
    networks: [inside, edge]

networks:
  inside:
    name: plexscratch42-inside
    internal: true
    ipam:
      config:
        - subnet: 172.31.19.0/24
  edge:
    name: plexscratch42-edge
    ipam:
      config:
        - subnet: 172.31.20.0/24
